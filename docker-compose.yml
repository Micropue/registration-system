
name: huhurun-server
services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: huhurun-api
    ports:
      - "8001:8000"
    volumes:
      - ./server/src:/server
    working_dir: /server
    environment:
      - MEDIA_DIR=/data/media
      - TZ=Asia/Shanghai
      - DB_URL=db:3306
      - DB_NAME=huhurun
      - DB_USERNAME=root
      - DB_PASSWORD=root
    depends_on:
      - db
    restart: always
    networks:
      - api-net
  db:
    image: mysql:8.0
    container_name: huhurun-database
    environment:
      - MYSQL_DATABASE=huhurun
      - MYSQL_ROOT_PASSWORD=root
      - TZ=Asia/Shanghai
    command: --default-time-zone='+08:00'
    ports:
      - "3308:3306"
    restart: always
    networks:
      - api-net
    volumes:
      - db-data:/var/lib/mysql
volumes:
  db-data:

networks:
  api-net:
