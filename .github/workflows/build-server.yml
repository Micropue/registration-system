name: Upload Server

# 自动部署已关闭，仅支持在 Actions 页面手动触发（Run workflow）
# 如需恢复 push 自动部署，取消下方 push 段的注释
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Upload Code
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          source: "server/src/*"
          target: "/sdb/huhurun@api/src"
          strip_components: 2